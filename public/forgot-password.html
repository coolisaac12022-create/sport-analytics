<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mot de passe oublie</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<header class="topbar">
<h1>Predize Foot Isaac</h1>
<p>Reinitialiser mon mot de passe</p>
</header>
<main class="container narrow">
<section class="card">
<h2>Etape 1 - Identifiant</h2>
<p class="hint">Entre l email ou le numero de telephone utilise a l inscription.</p>
<form id="requestForm" class="auth-form">
<label>Email ou telephone
<input type="text" id="identifier" required />
</label>
<button type="submit">Recevoir un code</button>
</form>
<p id="requestMessage" class="message"></p>
</section>
<section id="resetSection" class="card hidden">
<h2>Etape 2 - Nouveau mot de passe</h2>
<p class="hint">Entre le code recu et ton nouveau mot de passe.</p>
<form id="resetForm" class="auth-form">
<label>Code recu
<input type="text" id="code" maxlength="6" required />
</label>
<label>Nouveau mot de passe (8 caracteres minimum)
<input type="password" id="newPassword" minlength="8" required />
</label>
<button type="submit">Changer mon mot de passe</button>
</form>
<p id="resetMessage" class="message"></p>
</section>
</main>
<footer class="footer">
<p><a href="/login.html">Retour a la connexion</a></p>
</footer>
<script>
const API = "/api";
let savedIdentifier = "";
document.getElementById("requestForm").addEventListener("submit", async function(e) {
e.preventDefault();
const identifier = document.getElementById("identifier").value.trim();
const msg = document.getElementById("requestMessage");
msg.textContent = "Envoi en cours...";
msg.className = "message";
try {
const res = await fetch(API + "/auth/forgot-password", {
method: "POST",
headers: { "Content-Type": "application/json" },
body: JSON.stringify({ identifier: identifier })
});
const data = await res.json();
if (!res.ok) throw new Error(data.error || "Erreur.");
savedIdentifier = identifier;
msg.textContent = data.message;
msg.className = "message success";
document.getElementById("resetSection").classList.remove("hidden");
} catch (err) {
msg.textContent = err.message;
msg.className = "message error";
}
});
document.getElementById("resetForm").addEventListener("submit", async function(e) {
e.preventDefault();
const code = document.getElementById("code").value.trim();
const newPassword = document.getElementById("newPassword").value;
const msg = document.getElementById("resetMessage");
msg.textContent = "Verification...";
msg.className = "message";
try {
const res = await fetch(API + "/auth/reset-password", {
method: "POST",
headers: { "Content-Type": "application/json" },
body: JSON.stringify({ identifier: savedIdentifier, code: code, newPassword: newPassword })
});
const data = await res.json();
if (!res.ok) throw new Error(data.error || "Erreur.");
msg.textContent = data.message + " Redirection...";
msg.className = "message success";
setTimeout(function() { window.location.href = "/login.html"; }, 1200);
} catch (err) {
msg.textContent = err.message;
msg.className = "message error";
}
});
</script>
</body>
</html>
